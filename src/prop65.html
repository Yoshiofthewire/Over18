<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Prop 65 Warning</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 30px; color: #333; background: #fff8e1; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); }
    .warning { background: white; border: 3px solid #f9a825; border-radius: 8px; padding: 24px; max-width: 480px; text-align: center; }
    .warning h1 { color: #e65100; font-size: 20px; margin-bottom: 16px; }
    .warning p { line-height: 1.6; font-size: 15px; }
  </style>
</head>
<body>
  <div class="warning">
    <h1>⚠ WARNING</h1>
    <p>
      Risk of Cancer And Reproductive Harm From Exposure to the computer this application
      is running on — <strong>www.P65Warnings.ca.gov</strong>.
    </p>
    <p>
      Maybe next time wash your hands, and don't lick the caps.
    </p>
  </div>
</body>
</html>
