<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>18</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; gap: 20px; }
    .number { font-size: 36pt; font-weight: bold; color: #333; }
    .print-btn { padding: 8px 24px; font-size: 14px; background: #4a90d9; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .print-btn:hover { background: #357abd; }
    @media print { .print-btn { display: none; } }
  </style>
</head>
<body>
  <div class="number">18</div>
  <button id="print-btn" class="print-btn">Print</button>
  <script src="eighteen.js"></script>
</body>
</html>
